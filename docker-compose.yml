services:
  postgres:
    image: postgres:16-alpine
    container_name: riderapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: riderapp
      POSTGRES_PASSWORD: riderapp
      POSTGRES_DB: riderapp
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - riderapp-pgdata:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riderapp -d riderapp"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  riderapp-pgdata:
